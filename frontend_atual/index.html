<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guia Fácil</title>
  <!-- css dessa tela e de coisas específicas -->
  <link rel="stylesheet" href="css/style.css">
  <!-- css para todas as telas -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/accessibility.css">
  <script src="js/accessibility.js" defer></script>
</head>
<body>

  <!-- cabeçalho (igual em todas as telas) -->
  <header class="topo">
    <strong>Guia Fácil</strong>
    <!-- botoes do cabeçalho -->
    <nav class="botoes">
      <!-- botao de diminuir a letra -->
      <button type="button" aria-label="Diminuir letra" data-action="decrease-font">
        <svg viewBox="0 0 24 24"><path d="M3 19l5-13 5 13M5 14h6M17 9h5"/></svg>
      </button>
      <!-- botao de aumentar a letra -->
      <button type="button" aria-label="Aumentar letra" data-action="increase-font">
        <svg viewBox="0 0 24 24"><path d="M3 19l5-13 5 13M5 14h6M19.5 6.5v5M17 9h5"/></svg>
      </button>
      <!-- botao modo escuro -->
      <button type="button" aria-label="Modo escuro" data-action="toggle-theme" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>
      </button>
      <!-- botao da casinha que leva a tela inicial -->
      <a href="index.html" aria-label="Tela principal" title="Tela principal">
        <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4zM10 20v-6h4v6"/></svg>
      </a>
    </nav>
  </header>

    <!-- tela inicial -->
  <main class="tela">
    <h1>Como posso te ajudar hoje?</h1>
    <p class="subtitulo">Escolha um serviço para começar</p>

    <!-- caixa que junta os cartoes e da espaço entre eles -->
    <div class="servicos">
      <!-- cartao do atende+, abre a conversa dele (o # diz qual conversa vai mostrar) -->
      <a href="conversa.html#atende" class="cartao">
        <span class="icone">
          <svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0116 0v2M4 14h3v5H4zM17 14h3v5h-3zM20 19c0 2-2 3-5 3h-2"/></svg>
        </span>
        <span class="texto">
          <strong id="nome-atende">Carregando...</strong>
          <small id="descricao-atende">Carregando...</small>
        </span>
        <!-- seta p direita dentro do cartao -->
        <svg class="seta" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </a>
      <!-- cartao do meu inss -->
      <a href="conversa.html#meu-inss" class="cartao">
        <span class="icone">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M5.5 16c.5-2 3.5-2 4 0M14 10h4M14 14h4"/></svg>
        </span>
        <span class="texto">
          <strong id="nome-inss">Carregando...</strong>
          <small id="descricao-inss">Carregando...</small>
        </span>
        <!-- seta p direita -->
        <svg class="seta" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </a>

    </div>
    
    <!-- botao de sugestões e reclamações -->
    <a href="sugestoes.html" class="sugestoes">
    <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M12 8.5v3M12 13.5v.01"/></svg>
    <span id="nome-suporte">Carregando...</span>
    </a>
  </main>

  <p id="preferences-status" class="preferences-status" role="status"></p>
  <p id="erro-menu" role="status" style="text-align: center;"></p>
  <script src="js/menu.js"></script>
</body>
</html>
