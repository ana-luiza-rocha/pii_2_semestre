<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guia Fácil - Sugestões </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css?v=61">
  <link rel="stylesheet" href="css/style.css?v=74">
  <link rel="stylesheet" href="css/accessibility.css?v=72">
  <script src="js/accessibility.js?v=61" defer></script>
  <link rel="stylesheet" href="css/chatbot.css?v=67">
  <script src="js/chatbot-media.js?v=62" defer></script>
  <script src="js/chatbot.js?v=71" defer></script>
</head>
<body>

  <a class="pular" href="#chatbot">Pular para o conteúdo</a>

  <header class="topo navbar">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <a href="index.html" class="inicio"><strong>Guia Fácil</strong></a>
      <div class="menu-topo">
        <a href="sobre.html" class="sobre">Sobre</a>
        <a href="sugestoes.html" class="sobre">Sugestão</a>
      </div>
    </div>
  </header>

  <main class="tela container" id="chatbot" data-service="feedback">
    <div id="chatbot-aviso" class="balao aviso" hidden>
      <span class="icone" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/></svg></span>
      <span>Sua mensagem vai para a equipe do Guia Fácil. Não há resposta na hora.</span>
    </div>
    <div id="chatbot-message" tabindex="-1" aria-live="polite">
      <div class="balao">Carregando...</div>
    </div>
    <div id="chatbot-media"></div>

    <form id="chatbot-form" hidden>
      <div id="score-field" hidden>
        <p id="chatbot-score-aviso" role="status" hidden></p>
        <div id="chatbot-score-stars" role="group" aria-label="Sua nota para o tutorial">
          <span id="chatbot-score-value" aria-live="polite">0%</span>
          <span>
            <button type="button" data-score="1" aria-pressed="false" aria-label="1 estrela"><span aria-hidden="true">☆</span></button>
            <button type="button" data-score="2" aria-pressed="false" aria-label="2 estrelas"><span aria-hidden="true">☆</span></button>
            <button type="button" data-score="3" aria-pressed="false" aria-label="3 estrelas"><span aria-hidden="true">☆</span></button>
            <button type="button" data-score="4" aria-pressed="false" aria-label="4 estrelas"><span aria-hidden="true">☆</span></button>
            <button type="button" data-score="5" aria-pressed="false" aria-label="5 estrelas"><span aria-hidden="true">☆</span></button>
          </span>
        </div>
      </div>
      <div id="comment-field" hidden>
        <label id="rotulo-comentario" for="chatbot-comment">Sua mensagem</label>
        <textarea id="chatbot-comment" class="caixa-texto" maxlength="2000"></textarea>
        <p class="contador" id="chatbot-counter">0 / 2000 caracteres</p>
      </div>
    </form>

    <div id="chatbot-options"></div>
    <p id="chatbot-status" role="status" aria-live="polite"></p>
    <button type="button" id="chatbot-retry" class="opcao" hidden>Tentar novamente</button>
  </main>

  <div id="confirmacao" class="modal">
    <div class="modal-caixa">
      <div class="modal-icone" id="icone-sugestao" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3 11c.6.8 1 1.5 1 2h4c0-.5.4-1.2 1-2a6 6 0 0 0-3-11z"/></svg>
      </div>
      <div class="modal-icone" id="icone-reclamacao" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
      </div>
      <div class="modal-icone" id="icone-elogio" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 4.6-7 9-7 9z"/></svg>
      </div>
      <div class="modal-icone" id="icone-avaliacao" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3.5l2.4 5 5.5.8-4 3.9.9 5.5L12 16.2 7.2 18.7l.9-5.5-4-3.9 5.5-.8z"/></svg>
      </div>
      <h2 id="confirmacao-titulo">Deseja enviar?</h2>
      <p id="confirmacao-texto">Você poderá voltar e alterar o texto antes de enviar.</p>
      <button type="button" id="confirmar-voltar" class="botao secundario">Voltar e editar</button>
      <button type="button" id="confirmar-enviar" class="opcao">Sim, enviar</button>
    </div>
  </div>

  <p id="preferences-status" class="preferences-status" role="status"></p>

<div vw class="enabled">
  <div class="accessibility-widget">
    <div id="accessibility-options" class="accessibility-options" hidden>
      <div class="accessibility-item">
        <button type="button" data-action="decrease-font"><span class="bola" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 19l5-13 5 13M5 14h6M17 9h5"/></svg></span>Diminuir letra</button>
      </div>
      <div class="accessibility-item">
        <button type="button" data-action="increase-font"><span class="bola" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 19l5-13 5 13M5 14h6M19.5 6.5v5M17 9h5"/></svg></span>Aumentar letra</button>
      </div>
      <div class="accessibility-item">
        <button type="button" data-action="toggle-theme"><span class="bola" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg></span><span id="theme-description">Ativar modo escuro</span></button>
      </div>
      <div class="accessibility-item">
        <button type="button" class="libras-option" data-action="open-libras"><span class="bola" aria-hidden="true"><svg viewBox="0 0 32 26"><path d="M4 16V9a1.3 1.3 0 0 1 2.6 0v4V6a1.3 1.3 0 0 1 2.6 0v7V7.5a1.3 1.3 0 0 1 2.6 0V13V10a1.3 1.3 0 0 1 2.6 0v7a5 5 0 0 1-5 5h-.6a5 5 0 0 1-4.3-2.5l-1.2-2A1.3 1.3 0 0 1 4 16z"/><path d="M4 16V9a1.3 1.3 0 0 1 2.6 0v4V6a1.3 1.3 0 0 1 2.6 0v7V7.5a1.3 1.3 0 0 1 2.6 0V13V10a1.3 1.3 0 0 1 2.6 0v7a5 5 0 0 1-5 5h-.6a5 5 0 0 1-4.3-2.5l-1.2-2A1.3 1.3 0 0 1 4 16z" transform="translate(32 0) scale(-1 1)"/></svg></span>Traduzir para Libras</button>
      </div>
    </div>
    <button type="button" class="accessibility-toggle" data-action="toggle-accessibility" aria-expanded="false" aria-controls="accessibility-options">
      <span class="bola" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="7" r="1"/><path d="M5 10h14M12 10v9m0-5-4 5m4-5 4 5"/></svg></span>
      <span>Acessibilidade</span>
    </button>
  </div>
    <div vw-access-button class="active" style="display: none !important;"></div>
    <div vw-plugin-wrapper aria-hidden="true">
    <div class="vw-plugin-top-wrapper"></div>
  </div>
  </div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
  new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
