<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guia Fácil - Sugestões </title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/accessibility.css">
  <script src="js/accessibility.js" defer></script>
  <link rel="stylesheet" href="css/chatbot.css">
  <script src="js/chatbot-media.js" defer></script>
  <script src="js/chatbot.js" defer></script>
</head>
<body>

 <!-- cabeçalho (igual em todas as telas) -->
  <header class="topo">
    <strong>Guia Fácil</strong>
    <!-- botoes do cabeçalho -->
    <nav class="botoes">
      <!-- link "sobre": leva para a página sobre ) -->
      <a href="sobre.html" class="sobre">Sobre</a>  
      <!-- botao de diminuir a letra -->
      <button type="button" aria-label="Diminuir letra" data-action="decrease-font">
        <svg viewBox="0 0 24 24"><path d="M3 19l5-13 5 13M5 14h6M17 9h5"/></svg>
      </button>
      <!-- botao de aumentar a letra -->
      <button type="button" aria-label="Aumentar letra" data-action="increase-font">
        <svg viewBox="0 0 24 24"><path d="M3 19l5-13 5 13M5 14h6M19.5 6.5v5M17 9h5"/></svg>
      </button>
      <!-- botao modo escuro -->
      <button type="button" aria-label="Modo escuro" data-action="toggle-theme" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>
      </button>
    </nav>
  </header>

  <!-- tela de sugestões -->
  <main class="tela" id="chatbot" data-service="feedback">
    <div id="chatbot-message" tabindex="-1">
      <div class="balao">Carregando...</div>
    </div>
    <div id="chatbot-media"></div>

    <form id="chatbot-form" hidden>
      <div id="comment-field" hidden>
        <label for="chatbot-comment">Sua mensagem</label>
        <textarea id="chatbot-comment" class="caixa-texto" maxlength="2000"></textarea>
        <p class="contador" id="chatbot-counter">0 / 2000 caracteres</p>
      </div>
      <div id="score-field" hidden>
        <label for="chatbot-score">Sua nota para o tutorial</label>
        <select id="chatbot-score" class="caixa-texto">
          <option value="">Escolha uma nota</option>
          <option value="1">1 - Muito ruim</option>
          <option value="2">2 - Ruim</option>
          <option value="3">3 - Regular</option>
          <option value="4">4 - Bom</option>
          <option value="5">5 - Muito bom</option>
        </select>
      </div>
    </form>

    <div id="chatbot-options"></div>
    <p id="chatbot-status" role="status" aria-live="polite"></p>
    <button type="button" id="chatbot-retry" class="opcao" hidden>Tentar novamente</button>
  </main>

  <!-- icone do home lá embaixo -->
  <nav class="rodape" aria-label="Navegação principal">
  <a href="index.html" class="rodape-inicio">
    <span class="rodape-icone">
      <svg viewBox="0 0 24 24"><path d="M3 11.5L12 4l9 7.5"/><path d="M5.5 10v10h4.5v-6h4v6h4.5V10"/></svg>
    </span>
    Início
  </a>
  </nav>  

  <p id="preferences-status" class="preferences-status" role="status"></p>

  <!-- libras -->
<div vw class="enabled">
  <div vw-access-button class="active"></div>
  <div vw-plugin-wrapper>
    <div class="vw-plugin-top-wrapper"></div>
  </div>
</div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
  new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

</body>
</html>
