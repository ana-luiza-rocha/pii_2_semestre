<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guia Fácil - Conversa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=6">
  <link rel="stylesheet" href="css/global.css?v=6">
  <link rel="stylesheet" href="css/accessibility.css?v=6">
  <script src="js/accessibility.js?v=6" defer></script>
  <link rel="stylesheet" href="css/chatbot.css?v=6">
  <script src="js/chatbot-media.js?v=6" defer></script>
  <script src="js/chatbot.js?v=6" defer></script>

</head>
<body>

  <header class="topo navbar">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <a href="index.html" class="inicio"><strong>Guia Fácil</strong></a>
      <a href="sobre.html" class="sobre">Sobre</a>
    </div>
  </header>

  <main class="tela container" id="chatbot" data-service="atende">
    <div id="chatbot-message" tabindex="-1">
      <div class="balao">Carregando...</div>
    </div>
    <div id="chatbot-media"></div>

    <form id="chatbot-form" hidden>
      <div id="comment-field" hidden>
        <label for="chatbot-comment">Sua mensagem</label>
        <textarea id="chatbot-comment" class="caixa-texto" maxlength="2000"></textarea>
        <p class="contador" id="chatbot-counter">0 / 2000 caracteres</p>
      </div>
      <div id="score-field" hidden>
        <span id="chatbot-score-label">Sua nota para o tutorial</span>
        <div id="chatbot-score-stars" role="group" aria-labelledby="chatbot-score-label">
          <button type="button" data-score="1" aria-label="1 estrela" aria-pressed="false">☆</button>
          <button type="button" data-score="2" aria-label="2 estrelas" aria-pressed="false">☆</button>
          <button type="button" data-score="3" aria-label="3 estrelas" aria-pressed="false">☆</button>
          <button type="button" data-score="4" aria-label="4 estrelas" aria-pressed="false">☆</button>
          <button type="button" data-score="5" aria-label="5 estrelas" aria-pressed="false">☆</button>
          <span id="chatbot-score-value" aria-live="polite">Escolha de 1 a 5 estrelas</span>
        </div>
      </div>
    </form>

    <div id="chatbot-options"></div>
    <p id="chatbot-status" role="status" aria-live="polite"></p>
    <button type="button" id="chatbot-retry" class="opcao" hidden>Tentar novamente</button>
  </main>
  <p id="preferences-status" class="preferences-status" role="status"></p>

<div vw class="enabled">
  <div class="accessibility-widget">
    <div id="accessibility-options" class="accessibility-options" hidden>
      <div class="accessibility-item">
        <button type="button" aria-label="Diminuir letra" data-action="decrease-font"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19l5-13 5 13M5 14h6M17 9h5"/></svg></button>
        <span>Diminuir letra</span>
      </div>
      <div class="accessibility-item">
        <button type="button" aria-label="Aumentar letra" data-action="increase-font"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19l5-13 5 13M5 14h6M19.5 6.5v5M17 9h5"/></svg></button>
        <span>Aumentar letra</span>
      </div>
      <div class="accessibility-item">
        <button type="button" aria-label="Modo escuro" data-action="toggle-theme" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg></button>
        <span id="theme-description">Ativar modo escuro</span>
      </div>
      <div class="accessibility-item">
        <button type="button" class="libras-option" data-action="open-libras" aria-label="Abrir tradu&#231;&#227;o em Libras"><svg viewBox="0 0 32 26" aria-hidden="true"><path d="M4 16V9a1.3 1.3 0 0 1 2.6 0v4V6a1.3 1.3 0 0 1 2.6 0v7V7.5a1.3 1.3 0 0 1 2.6 0V13V10a1.3 1.3 0 0 1 2.6 0v7a5 5 0 0 1-5 5h-.6a5 5 0 0 1-4.3-2.5l-1.2-2A1.3 1.3 0 0 1 4 16z"/><path d="M4 16V9a1.3 1.3 0 0 1 2.6 0v4V6a1.3 1.3 0 0 1 2.6 0v7V7.5a1.3 1.3 0 0 1 2.6 0V13V10a1.3 1.3 0 0 1 2.6 0v7a5 5 0 0 1-5 5h-.6a5 5 0 0 1-4.3-2.5l-1.2-2A1.3 1.3 0 0 1 4 16z" transform="translate(32 0) scale(-1 1)"/></svg></button>
        <span>Traduzir para Libras</span>
      </div>
    </div>
    <button type="button" class="accessibility-toggle" data-action="toggle-accessibility" aria-label="Abrir opções de acessibilidade" aria-expanded="false" aria-controls="accessibility-options">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="7" r="1"/><path d="M5 10h14M12 10v9m0-5-4 5m4-5 4 5"/></svg>
    </button>
  </div>
    <div vw-access-button class="active" style="display: none !important;"></div>
    <div vw-plugin-wrapper>
    <div class="vw-plugin-top-wrapper"></div>
  </div>
  </div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
  new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
